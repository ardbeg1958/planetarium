  for(const fz of FUZ){if(projJ(fz.v)&&Math.hypot(PX-x,PY-y)<Math.max(26,fz.a*FR.R*D2R*.6)&&FR.lim>4.8){const o=OBJ_NOTE[fz.id];showLabel(o[0],'',o[1],8);AUD.bell(1318.5,.05);return}}
  if(Math.abs(gz)<.14&&FR.lim>4.8){const o=OBJ_NOTE.MW;showLabel(o[0],'',o[1],8);return}}
 hideLabel()}
function ml(){return FR.lim}
function distSeg(px,py,e){const dx=e[2]-e[0],dy=e[3]-e[1],L2=dx*dx+dy*dy||1;let t=((px-e[0])*dx+(py-e[1])*dy)/L2;t=clamp(t,0,1);return Math.hypot(px-(e[0]+dx*t),py-(e[1]+dy*t))}
const MAGSTR=m=>(m<0?'−'+(-m).toFixed(1):m.toFixed(1))+'等星';
const PNOTE={mercury:'太陽のすぐそばをまわる、いちばん内側の惑星。夕方か明け方に、低い空でわずかに見えます。',venus:'「宵の明星」「明けの明星」。月の次に明るく見える、地球のとなりの惑星です。',mars:'赤い星。地球との距離が大きく変わるため、明るさもずいぶん変化します。',jupiter:'太陽系最大の惑星。小さな望遠鏡でも、縞模様と4つの衛星が見えます。',saturn:'環をもつ惑星。ゆっくり動くので、星座の中でもほとんど位置が変わりません。'};
function showBest(b){
 if(b.type==='star'){const s=b.s;
  if(PLEI.has(s.key)){const o=OBJ_NOTE.M45;showLabel(o[0],'おうし座 ・ 約440光年',o[1],8);AUD.bell(1174.66,.05);return}
  const cn=CONNAME[s.con]||'';const nt=NOTE[s.key];const name=s.jp||`${cn}の星`;
  const sub=[cn,MAGSTR(s.mag),nt&&nt[0]?`約${nt[0]}光年`:''].filter(Boolean).join(' ・ ');
  let note=nt?nt[1]:(CONINFO[s.con]?CONINFO[s.con][3]:'');showLabel(name,sub,note,8);AUD.bell(1174.66*(s.mag<1?1:1.125),.05);
  const c=s.conObj||conById[s.con];if(c&&!c.aster){S.focus={con:c,t0:S.T,tour:false,fadeT:0,start:S.T,quiet:true}}return}
 if(b.type==='pl'){const p=b.p;showLabel(p.jp,`惑星 ・ 約${MAGSTR(p.mag).replace('等星','等')}`,PNOTE[p.key]+'（位置はかんたんな計算によるおおよそです）',8);AUD.bell(987.77,.05);return}
 if(b.type==='moon'){const k=FR.moonK,ph=moonPhaseName(k,FR.moonC);showLabel('月',`${ph} ・ 輝いている部分 ${Math.round(k*100)}%`,'実際の日付から計算した月の満ち欠けです。',8);AUD.bell(783.99,.05)}}
function moonPhaseName(k,c){const j=jdOf(S.t);const sv=sunVec(j),mv=moonVec(j).v;
 // 月齢の向き：黄道経度差
 const ls=Math.atan2(sv[1],sv[0]),lm=Math.atan2(mv[1],mv[0]);let d=((lm-ls)*R2D%360+360)%360;
 const n=['新月','三日月','上弦の月','十三夜ごろ','満月','十八夜ごろ','下弦の月','二十六夜ごろ'];return n[Math.round(d/45)%8]}

/* ===================== buttons ===================== */
function refreshButtons(){$('bLines').classList.toggle('off',!S.lines);$('bNames').classList.toggle('off',!S.names);$('bSnd').textContent=AUD.muted?'音 OFF':'音 ON';$('bSnd').classList.toggle('off',AUD.muted);
 $('bSpeed').textContent=SPEEDS[S.speedIdx].n;$('bTour').classList.toggle('off',!S.tour);$('bTour').textContent=S.tour?'自動ツアー':'ツアー OFF';$("bSeason").textContent=SEAS[S.seas].n;layoutUI()}
function btn(id,fn){$(id).addEventListener('click',e=>{e.stopPropagation();AUD.start();S.uiT=0;fn();refreshButtons()})}
btn('bLines',()=>{S.lines=!S.lines;store.set('pl_lines',S.lines?'1':'0')});
btn('bNames',()=>{S.names=!S.names;store.set('pl_names',S.names?'1':'0')});
btn('bSpeed',()=>{S.speedIdx=(S.speedIdx+1)%SPEEDS.length;S.rate=SPEEDS[S.speedIdx].r;store.set('pl_speed',S.speedIdx)});
btn('bSnd',()=>{AUD.setMuted(!AUD.muted)});
btn('bTour',()=>{S.tour=!S.tour;store.set('pl_tour',S.tour?'1':'0');if(S.tour){S.tourPause=0;S.focus=null}else{if(S.focus&&S.focus.tour){S.focus=null;hideLabel()}}});
btn('bSeason',()=>{setSeason((S.seas+1)%SEAS.length)});
function setSeason(i){S.seas=i;let t;const now=new Date(),yr=now.getFullYear();
 if(i===0){t=nightStart(Date.now(),-13)}
 else{const s=SEAS[i];let best=null;// 月が三日月ごろ(夕方に西)になる日を探す
  for(let dd=-12;dd<=12;dd++){const tt=jst(yr,s.mo,s.d+dd,Math.floor(s.h),(s.h%1)*60);const mi=moonIllum(tt);const sc=Math.abs(mi.k-.2)+ (moonWaxing(tt)?0:.3);if(!best||sc<best[0])best=[sc,tt]}
  t=best[1]}
 S.t=t;S.focus=null;hideLabel();S.fade=0;S.fadeDir=0}
function moonWaxing(ms){const j=jdOf(ms),sv=sunVec(j),mv=moonVec(j).v;const ls=Math.atan2(sv[1],sv[0]),lm=Math.atan2(mv[1],mv[0]);const d=((lm-ls)*R2D%360+360)%360;return d<180}

/* ===================== main loop ===================== */
let last=0,raf=0,gapEma=16.7,perfEma=16,perfN=0,lowCnt=0,hiCnt=0;
function advanceTime(dt){
 if(S.frozen)return;S.t+=dt*1000*S.rate;
 // 夜明けが近づいたら、次の夕暮れまで場面転換
 if(!S.allowDay&&S.fadeDir===0){const na=sunAltOf(S.t);if(na>-5.5&&na>FR.sunAlt){S.fadeDir=1}}
 if(S.fadeDir===1){S.fade+=dt/1.4;if(S.fade>=1){S.fade=1;S.t=nextDusk(S.t,-13);S.fadeDir=-1;S.focus=null;hideLabel()}}
 else if(S.fadeDir===-1){S.fade-=dt/1.8;if(S.fade<=0){S.fade=0;S.fadeDir=0}}}
function updateClock(){const d=new Date(S.t+9*3600000);const mo=d.getUTCMonth()+1,dd=d.getUTCDate(),hh=String(d.getUTCHours()).padStart(2,'0'),mm=String(d.getUTCMinutes()).padStart(2,'0');
 const s=`${mo}月${dd}日　${hh}:${mm}`;const el=$('clock');if(el._s!==s){el.textContent=s;el._s=s}}
function update(dt){
 S.T+=dt;S.uiT+=dt;
 const prevSun=FR.sunAlt;FR.prevSun=prevSun===undefined?-30:prevSun;
 advanceTime(dt);
 frameSetup();
 // 慣性
 if(ptrs.size===0&&(Math.abs(S.vx)>1e-5||Math.abs(S.vy)>1e-5)){S.az+=S.vx*dt*60;S.alt=clamp(S.alt+S.vy*dt*60,3*D2R,89*D2R);S.az=((S.az%TAU)+TAU)%TAU;const d=Math.exp(-dt*6);S.vx*=d;S.vy*=d}
 {const f=S.focus;if(f&&!f.tour){if(!f.fadeT&&S.T-f.start>10)f.fadeT=S.T;if(f.fadeT&&S.T-f.fadeT>1.8)S.focus=null}}
 tourStep(dt);
 const following=ptrs.size===0&&followTour(dt);
 if(!following){S.cyOff+=(0-S.cyOff)*(1-Math.exp(-dt*1.5))}
 S.az=((S.az%TAU)+TAU)%TAU;if(!S.dbg){const am=Math.min(altMin(),80*D2R);if(S.alt<am)S.alt+=(am-S.alt)*(1-Math.exp(-dt*5))}S.alt=clamp(S.alt,3*D2R,89*D2R);
 if(labT>0){labT-=dt;if(labT<=0&&!(S.focus&&S.focus.tour&&!S.focus.fadeT))lab.classList.remove('on')}
 // 流れ星
 S.nextShoot-=dt;if(S.nextShoot<=0&&FR.lim>4.5&&!document.hidden){spawnShoot();S.nextShoot=9+Math.random()*22}
 AUD.tick();updateClock();
 if(S.uiT>4.8)document.body.classList.add('idle');else document.body.classList.remove('idle');
 $('bar').classList.toggle('on',S.uiT<4.2)}
function stage(n,f){if(!S.prof){f();return}const a=performance.now();f();PROF[n]=(PROF[n]||0)+performance.now()-a}
let skyLast=null,skyFrames=0;
function skyDirty(){const l=skyLast;if(!l||S.fade>0||skyFrames>24)return true;const d=Math.abs(angDiff(S.az,l.az))*Math.cos(S.alt)+Math.abs(S.alt-l.alt);const dt=Math.abs(S.t-l.t)/86400000*TAU;
 return FR.R*(d+dt)>1.6||Math.abs(FR.R-l.R)>l.R*.003||Math.abs(FR.cy-l.cy)>.6||l.W!==W||l.H!==H||l.q!==Q.lvl}
function drawSky(){if(skyDirty()){skyPass();skyLast={az:S.az,alt:S.alt,t:S.t,R:FR.R,cy:FR.cy,W,H,q:Q.lvl};skyFrames=0}else{skyFrames++;ctx.imageSmoothingEnabled=true;ctx.drawImage(bcv,0,0,bw,bh,0,0,bw*sc,bh*sc)}}
function draw(){
 stage('sky',drawSky);stage('fuzzy',drawFuzzy);stage('stars',drawStars);stage('lines',drawLines);stage('hl',drawHighlight);stage('names',drawNames);stage('moon',drawMoon);stage('planets',drawPlanets);stage('shoots',drawShoots);stage('ground',drawGround);
 if(S.fade>0){ctx.fillStyle=`rgba(2,4,10,${clamp(S.fade,0,1)})`;ctx.fillRect(0,0,W,H)}}
function frame(now){raf=requestAnimationFrame(frame);if(S.paused){last=now;return}let dt=(now-last)/1000;last=now;if(!(dt>0))return;if(dt>.1)dt=.1;
 gapEma=gapEma*.96+dt*1000*.04;const t0=performance.now();ctx.setTransform(dpr,0,0,dpr,0,0);update(dt);draw();
 const el=performance.now()-t0;perfEma=perfEma*.95+el*.05;perfN++;
 if(perfN>90){ if((perfEma>13||gapEma>24)&&Q.lvl>0){lowCnt++;if(lowCnt>2){setQuality(Q.lvl-1);lowCnt=0;perfN=0;perfEma=8;gapEma=16.7}}else lowCnt=0;
  if(perfEma<5&&Q.lvl<2&&MOBILE===false&&perfN>400){hiCnt++;if(hiCnt>3){setQuality(Q.lvl+1);hiCnt=0;perfN=0}}}
}
const MOBILE=/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&innerWidth<900);
function init(){
 setQuality(MOBILE?1:2);
 S.fov=S.tfov=W<H?62:78;
 S.t=nightStart(Date.now(),-13);S.az=190*D2R;S.alt=(W<H?50:38)*D2R;
 refreshButtons();
 addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);AUD.suspend()}else{last=performance.now();AUD.resume();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}});
 if(!store.get('pl_seen',0)){store.set('pl_seen','1');setTimeout(()=>{$('hint').classList.add('on');setTimeout(()=>$('hint').classList.remove('on'),5500)},1800)}
 FR.prevSun=-30;frameSetup();last=performance.now();raf=requestAnimationFrame(frame)}
window.__pl={S,FR,Q,AUD,real,cons,byKey,setQuality,
 setTime(y,mo,d,h,mi){S.t=jst(y,mo-1,d,h,mi||0);S.frozen=true;S.allowDay=true;S.fadeDir=0;S.fade=0},
 setView(az,alt,fov){S.dbg=true;S.az=az*D2R;S.alt=alt*D2R;if(fov){S.fov=S.tfov=fov}},
 setSeason,freeze(v){S.frozen=v!==false},
 step(n,dt){dt=dt||1/30;for(let i=0;i<n;i++){ctx.setTransform(dpr,0,0,dpr,0,0);update(dt);draw()}},
 tourOff(){S.tour=false;S.focus=null;hideLabel();refreshButtons()},
 tourOn(){S.tour=true;S.tourPause=0;refreshButtons()},
 focus(id){const c=conById[id]||asters.find(a=>a.id===id);S.tourPause=S.T+9999;S.focus=null;focusCon(c,false);S.focus.t0=S.T-5;return c},
 shoot(){return spawnShoot(true)},
 aa(key){const s=byKey[key];const h=jToH(s.x,s.y,s.z);return{az:((Math.atan2(h[0],h[1])*R2D)+360)%360,alt:Math.asin(h[2])*R2D}},
 conAA(id){const c=conById[id];const h=jToH(c.cv[0],c.cv[1],c.cv[2]);return{az:((Math.atan2(h[0],h[1])*R2D)+360)%360,alt:Math.asin(h[2])*R2D}},
 planetsAA(){return FR.planets.map(p=>{const h=jToH(p.v[0],p.v[1],p.v[2]);return{n:p.key,az:((Math.atan2(h[0],h[1])*R2D)+360)%360,alt:Math.asin(h[2])*R2D,mag:p.mag}})},
 moonAA(){const h=FR.moonH;return{az:((Math.atan2(h[0],h[1])*R2D)+360)%360,alt:Math.asin(h[2])*R2D,k:FR.moonK}},
 sunAlt(){return FR.sunAlt},
 moonXY(){return projH(FR.moonH)?[PX,PY]:null},
 starXY(k){const s=byKey[k];return projJ([s.x,s.y,s.z])?[PX,PY]:null},
 tap(x,y){doTap(x,y)},
 perf(){return{ema:perfEma,q:Q.lvl}},PROF,prof(n){S.prof=true;for(const k in PROF)delete PROF[k];const a=performance.now();for(let i=0;i<n;i++){ctx.setTransform(dpr,0,0,dpr,0,0);const t=performance.now();update(1/60);const u=performance.now()-t;PROF.update=(PROF.update||0)+u;draw()}const tot=performance.now()-a;S.prof=false;const o={};for(const k in PROF)o[k]=+(PROF[k]/n).toFixed(2);o.total=+(tot/n).toFixed(2);return o}};
init();
})();
